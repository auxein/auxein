name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync
      - run: uv run pytest --cov=auxein

  lowest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv sync --resolution lowest-direct
      - run: uv run pytest

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run ruff check
      - run: uv run ruff format --check

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run pyright

  build:
    # The package builds, and the wheel carries the type marker. Nothing is published: there is no release workflow.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - run: unzip -l dist/*.whl | grep -q "auxein/py.typed"

  benchmarks:
    # Runs the quick benchmark and the report as a smoke test. It fails on crashes, exceptions or a timeout, never on quality results.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - id: run
        run: |
          results=$(uv run python -m benchmarks run --config benchmarks/configs/quick.toml)
          echo "results=$results" >> "$GITHUB_OUTPUT"
      - run: uv run python -m benchmarks report "${{ steps.run.outputs.results }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-quick-results
          path: benchmarks/results/
