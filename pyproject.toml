[project]
name = "auxein"
version = "0.2.0"
description = "Auxein is a Python framework for evolutionary algorithms."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Davide Palmisano", email = "dpalmisano@gmail.com" }]
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "array-api-compat>=1.9"]

[project.optional-dependencies]
torch = ["torch>=2.4"]

[dependency-groups]
dev = [
    "torch>=2.4",
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-timeout>=2.3",
    "ruff>=0.6",
    "pyright>=1.1.380",
]
bench = [
    "cma>=3.3",
    "matplotlib>=3.9",
    "scipy>=1.11",
]
examples = [
    "ipykernel>=6.29",
    "matplotlib>=3.9",
    "nbclient>=0.10",
    "nbmake>=1.5",
    "pytest>=8",
]

[tool.uv]
# the benchmark harness tests run with the main test suite, so its dependencies are installed by default
default-groups = ["dev", "bench"]

# On Linux (CI) torch comes from PyTorch's CPU-only index: the default PyPI wheels pull in about 3 GB of CUDA
# libraries that the tests never use. Other platforms keep the PyPI wheels (macOS wheels include Metal/MPS support).
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["auxein"]

[tool.ruff]
target-version = "py311"
line-length = 140
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I"]
# E501: the previous lint config ignored it too. B905: adding zip(strict=) would change behaviour; revisit in the redesign.
ignore = ["E501", "B905"]

[tool.pyright]
include = ["auxein", "benchmarks"]
exclude = ["benchmarks/results"]
pythonVersion = "3.11"
# the new core is checked in strict mode; the 0.x modules are removed in a later step
strict = ["auxein/backend", "auxein/random", "auxein/core", "auxein/spaces"]

[tool.pytest.ini_options]
testpaths = ["tests", "benchmarks/tests"]
pythonpath = ["."]
