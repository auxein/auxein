[project]
name = "auxein"
version = "0.3.0.dev0"
description = "Auxein is a Python framework for evolving agents that act in environments."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Davide Palmisano", email = "dpalmisano@gmail.com" }]
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "array-api-compat>=1.9"]

[project.optional-dependencies]
torch = ["torch>=2.4"]
cma = ["cma>=3.3"]
gymnasium = ["gymnasium>=0.29"]

[dependency-groups]
dev = [
    "torch>=2.4",
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-timeout>=2.3",
    "ruff>=0.6",
    "pyright>=1.1.380",
    "cma>=3.3",
    "gymnasium>=0.29",
]
bench = [
    "cma>=3.3",
    "matplotlib>=3.9",
    "pymoo>=0.6.2",
    "scipy>=1.11",
]
notebooks = [
    "ipykernel>=6.29",
    "matplotlib>=3.9",
    "nbmake>=1.5",
]

[tool.uv]
# the benchmark harness tests run with the main test suite, so its dependencies are installed by default
default-groups = ["dev", "bench"]
# Every resolution must contain wheels for x86_64 Linux (CI). Without this, `--resolution lowest-direct` picks the bare
# `torch 2.4.0` of the CPU index, which only has aarch64 wheels (the x86_64 ones are `2.4.0+cpu`).
required-environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

# On Linux (CI) torch comes from PyTorch's CPU-only index: the default PyPI wheels pull in about 3 GB of CUDA
# libraries that the tests never use. Other platforms keep the PyPI wheels (macOS wheels include Metal/MPS support).
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["auxein"]

[tool.ruff]
target-version = "py311"
line-length = 140
extend-exclude = ["docs"]  # ruff would format the code sketches of the design document

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I"]

[tool.ruff.lint.per-file-ignores]
# the report is written as markdown prose in template strings, where a line is a paragraph: wrapping it would only move the text around
"benchmarks/report.py" = ["E501"]
"benchmarks/mo_report.py" = ["E501"]  # the same: prose in template strings

[tool.pyright]
include = ["auxein", "benchmarks"]
exclude = ["benchmarks/results"]
pythonVersion = "3.11"
# the whole package is checked in strict mode; the benchmark harness is not part of it and stays at the standard level
strict = ["auxein"]

[tool.pytest.ini_options]
testpaths = ["tests", "benchmarks/tests"]
pythonpath = ["."]
