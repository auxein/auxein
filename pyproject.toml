[project]
name = "auxein"
version = "0.1.2"
description = "Auxein is a Python framework for evolutionary algorithms."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Davide Palmisano", email = "dpalmisano@gmail.com" }]
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-timeout",
    "ruff",
    "pyright",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["auxein"]

[tool.ruff]
target-version = "py311"
line-length = 140
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
# E501: the old flake8 config ignored it too. B905: adding zip(strict=) would change behaviour; revisit in the redesign.
ignore = ["E501", "B905"]

[tool.pyright]
include = ["auxein"]
pythonVersion = "3.11"
