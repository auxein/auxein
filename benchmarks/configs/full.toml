# The full benchmark: the baseline for judging future versions of Auxein.
name = "full"
base_seed = 0
runs = 25                 # run k of every algorithm uses instance k and seed base_seed + k
budget_per_dim = 2000     # fitness evaluations = 2000 * dimension
dims = [2, 10, 30]
problems = ["sphere", "ellipsoid", "rosenbrock", "rastrigin", "noisy_sphere"]
targets = [1e-1, 1e-3, 1e-6]

[[algorithms]]
name = "auxein-default"
adapter = "auxein_static"
[algorithms.params]
population_size = 100
mutation = { type = "self_adaptive", tau = 0.1 }
distribution = "sigma_scaling"
offspring_size = 4
alpha = 0.5

[[algorithms]]
name = "auxein-fixedvar"
adapter = "auxein_static"
[algorithms.params]
population_size = 100
mutation = { type = "fixed_variance", sigma = 0.1 }
distribution = "sigma_scaling"
offspring_size = 4
alpha = 0.5

[[algorithms]]
name = "auxein-windowing"
adapter = "auxein_static"
[algorithms.params]
population_size = 100
mutation = { type = "self_adaptive", tau = 0.1 }
distribution = "fps_windowing"
offspring_size = 4
alpha = 0.5

[[algorithms]]
name = "random-search"
adapter = "random_search"

[[algorithms]]
name = "cma-es"
adapter = "cmaes"
[algorithms.params]
sigma0 = 2.0
x0_range = 4.0

[[algorithms]]
name = "auxein-core-random"
adapter = "auxein_core_random"

[overhead]
budget = 20000
repeats = 5
dims = [2, 10, 100]
population_sizes = [50, 200, 800]
