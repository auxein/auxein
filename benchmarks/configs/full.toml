# The full benchmark: the baseline for judging future versions of Auxein.
name = "full"
base_seed = 0
runs = 25                 # run k of every algorithm uses instance k and seed base_seed + k
budget_per_dim = 2000     # fitness evaluations = 2000 * dimension
dims = [2, 10, 30]
problems = ["sphere", "ellipsoid", "rosenbrock", "rastrigin", "noisy_sphere"]
targets = [1e-1, 1e-3, 1e-6]

[report]
references = ["auxein-core-ga"]   # the algorithms the statistical comparison is made from

[[algorithms]]
name = "auxein-core-ga"
adapter = "auxein_core_ga"
[algorithms.params]
# explicit so that the overhead benchmark can vary population_size; these are the constructor defaults of GeneticAlgorithm
population_size = 50
offspring_size = 50
selection = { type = "tournament", size = 2 }
recombination = { type = "intermediate", per_gene = false }
mutation = { type = "self_adaptive", per_gene = false, initial_step = 0.1, min_step = 1e-12 }
repair = "clip"

[[algorithms]]
name = "auxein-core-random"
adapter = "auxein_core_random"

[[algorithms]]
name = "random-search"
adapter = "random_search"

[[algorithms]]
name = "cma-es"
adapter = "cmaes"
[algorithms.params]
sigma0 = 2.0
x0_range = 4.0

[overhead]
budget = 20000
repeats = 5
dims = [2, 10, 100]
population_sizes = [50, 200, 800]
