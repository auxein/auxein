# A smoke-sized benchmark for CI: it checks that the harness works, not how well the algorithms do.
name = "quick"
base_seed = 0
runs = 3
budget_per_dim = 500
dims = [2, 10]
problems = ["sphere", "ellipsoid", "rosenbrock", "rastrigin", "noisy_sphere"]
targets = [1e-1, 1e-3, 1e-6]

[report]
references = ["auxein-core-ga"]

[[algorithms]]
name = "auxein-core-ga"
adapter = "auxein_core_ga"
[algorithms.params]
# explicit so that the overhead benchmark can vary population_size; these are the constructor defaults of GeneticAlgorithm
population_size = 50
offspring_size = 50
selection = { type = "tournament", size = 2 }
recombination = { type = "intermediate", per_gene = false }
mutation = { type = "self_adaptive", per_gene = false, initial_step = 0.1, min_step = 1e-12 }
repair = "clip"

[[algorithms]]
# the same algorithm on PyTorch (CPU, float32), so that the CI benchmark job exercises the torch backend end to end
name = "auxein-core-ga-torch"
adapter = "auxein_core_ga"
[algorithms.params]
backend = "torch"
precision = "float32"
population_size = 50
offspring_size = 50
selection = { type = "tournament", size = 2 }
recombination = { type = "intermediate", per_gene = false }
mutation = { type = "self_adaptive", per_gene = false, initial_step = 0.1, min_step = 1e-12 }
repair = "clip"

[[algorithms]]
name = "auxein-core-random"
adapter = "auxein_core_random"

[[algorithms]]
name = "random-search"
adapter = "random_search"

[[algorithms]]
name = "cma-es"
adapter = "cmaes"
[algorithms.params]
sigma0 = 2.0
x0_range = 4.0

[overhead]
budget = 2000
repeats = 1
dims = [2, 10]
population_sizes = [50, 200]
